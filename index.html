<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Veggies Apps</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-color: #f3f4f6; margin: 0; color: #1f2937; }
    .container { text-align: center; background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
    h1 { margin-top: 0; color: #10b981; font-size: 2.5rem; margin-bottom: 0.5rem; }
    p { color: #6b7280; margin-bottom: 2rem; font-size: 1.1rem; }
    .buttons { display: flex; gap: 1rem; justify-content: center; }
    a { display: inline-block; padding: 0.75rem 1.5rem; background: #10b981; color: white; text-decoration: none; border-radius: 8px; font-weight: 600; transition: background 0.2s; }
    a:hover { background: #059669; }
    a.admin { background: #4b5563; }
    a.admin:hover { background: #374151; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Veggies Apps Portal</h1>
    <p>Select the application you want to launch:</p>
    <div class="buttons">
      <a href="./customer/">Customer App</a>
      <a href="./admin/" class="admin">Admin App</a>
    </div>
  </div>
</body>
</html>
