name: Deploy Web Apps to GitHub Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

env:
  NEXT_PUBLIC_SUPABASE_URL: "https://zuoqvvyiklcltacmgojz.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp1b3F2dnlpa2xjbHRhY21nb2p6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NzQwMzMsImV4cCI6MjA5NjE1MDAzM30.Av9H6ZTVXvy6YyxCAhyaI9xffHsPlNo_Q0R3Y7DCmcw"
  NEXT_PUBLIC_STORE_LAT: "13.0017689"
  NEXT_PUBLIC_STORE_LON: "77.5777957"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Customer App
        run: npm run build:customer
        env:
          GITHUB_ACTIONS: 'true'
          REPO_NAME: ${{ github.event.repository.name }}

      - name: Build Admin App
        run: npm run build:admin
        env:
          GITHUB_ACTIONS: 'true'
          REPO_NAME: ${{ github.event.repository.name }}

      - name: Prepare Deployment Directory
        run: |
          mkdir deploy
          cp -r apps/customer/out deploy/customer
          cp -r apps/admin/out deploy/admin
          touch deploy/.nojekyll
          
          # Create a root landing page to prevent 404 at the base repository URL
          cat << 'EOF' > deploy/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Veggies Apps</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-color: #f3f4f6; margin: 0; color: #1f2937; }
              .container { text-align: center; background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
              h1 { margin-top: 0; color: #10b981; font-size: 2.5rem; margin-bottom: 0.5rem; }
              p { color: #6b7280; margin-bottom: 2rem; font-size: 1.1rem; }
              .buttons { display: flex; gap: 1rem; justify-content: center; }
              a { display: inline-block; padding: 0.75rem 1.5rem; background: #10b981; color: white; text-decoration: none; border-radius: 8px; font-weight: 600; transition: background 0.2s; }
              a:hover { background: #059669; }
              a.admin { background: #4b5563; }
              a.admin:hover { background: #374151; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>Veggies Apps Portal</h1>
              <p>Select the application you want to launch:</p>
              <div class="buttons">
                <a href="./customer/">Customer App</a>
                <a href="./admin/" class="admin">Admin App</a>
              </div>
            </div>
          </body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy
          branch: gh-pages
